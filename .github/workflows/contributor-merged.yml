name: 🤖 BOT | Community | Contributor merged

# Thin caller: the thank-you logic is shared in flisk-sh/.github, so every repo uses one copy
# and a single change there updates them all. Runs on a closed PR (the shared workflow checks it
# was merged from an outside contributor) and can be re-run by hand for a PR whose run failed.
# The shared workflow never checks out or runs PR code; it only reads event data and posts comments.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] the shared workflow never checks out or runs PR code; it only reads event data
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged PR number to thank
        required: true

permissions: {}

jobs:
  thank:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: flisk-sh/.github/.github/workflows/contributor-merged.yml@f4a7cf54a888162729b0710bfbc54e92b0128c80 # v1.4.0+ shared contributor-merged
