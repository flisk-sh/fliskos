<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="flisk-token" content="__FLISK_CENTER_TOKEN__" />
    <meta name="description" content="FliskOS: your Flisk projects, your coding agents and the Flisk apps in one local window" />
    <title>FliskOS</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
        font-size: 13px;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --canvas: #f4f4f6;
        --sidebar: #ececef;
        --surface: #fff;
        --surface-alt: #f8f8fa;
        --raised: #fff;
        --label: #232327;
        --secondary: #72727b;
        --tertiary: #9999a2;
        --line: #e4e4e8;
        --line-soft: #eeeeF1;
        --accent: #3478d4;
        --accent-wash: #e4eefc;
        --green: #33875b;
        --green-wash: #e4f3e9;
        --amber: #9b6a12;
        --amber-wash: #fbf1d9;
        --red: #c6433d;
        --red-wash: #fbe9e8;
        --shadow: 0 1px 2px #17171b0a, 0 8px 24px #17171b08;
        --sidebar-width: 258px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #191a1c;
          --sidebar: #202124;
          --surface: #242528;
          --surface-alt: #292a2e;
          --raised: #2d2e32;
          --label: #ededf0;
          --secondary: #a1a1aa;
          --tertiary: #77777f;
          --line: #34353a;
          --line-soft: #2f3035;
          --accent: #82afea;
          --accent-wash: #26364d;
          --green: #79c897;
          --green-wash: #24382c;
          --amber: #e2bd72;
          --amber-wash: #3c3322;
          --red: #ed8984;
          --red-wash: #402b2a;
          --shadow: 0 1px 2px #0003, 0 8px 24px #0002;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; height: 100vh; min-height: 540px; overflow: hidden; background: var(--canvas); color: var(--label); }
      button, input { color: inherit; font: inherit; }
      button { cursor: pointer; }
      button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 46%, transparent); outline-offset: 2px; }
      .app { display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); height: 100%; }
      .sidebar { min-width: 0; display: flex; flex-direction: column; background: color-mix(in srgb, var(--sidebar) 94%, transparent); border-right: 1px solid var(--line); }
      .brand { height: 58px; display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid var(--line-soft); }
      .brand-mark { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 8px; background: var(--label); color: var(--canvas); font-weight: 700; font-size: 13px; letter-spacing: -.04em; }
      .brand-name { font-size: 13px; font-weight: 650; letter-spacing: -.01em; }
      .local-mark { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 15%, transparent); }
      .sidebar-tools { padding: 13px 12px 8px; }
      .search { position: relative; }
      .search svg { position: absolute; width: 14px; height: 14px; left: 9px; top: 9px; color: var(--tertiary); pointer-events: none; }
      .search input { width: 100%; height: 32px; border: 1px solid var(--line-soft); border-radius: 10px; background: color-mix(in srgb, var(--surface) 70%, transparent); padding: 0 10px 0 30px; font-size: 12px; }
      .search input::placeholder { color: var(--tertiary); }
      .side-nav { padding: 2px 8px 12px; }
      .nav-item, .project-item { width: 100%; min-width: 0; border: 0; display: flex; align-items: center; gap: 9px; text-align: left; border-radius: 9px; background: transparent; color: var(--secondary); padding: 7px 9px; transition: background .16s ease, color .16s ease; }
      .nav-item:hover, .project-item:hover { background: color-mix(in srgb, var(--label) 6%, transparent); color: var(--label); }
      .nav-item.active, .project-item.active { background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--label); }
      .nav-item svg { width: 15px; height: 15px; }
      .nav-item .count, .section-title .count { margin-left: auto; color: var(--tertiary); font-size: 11px; font-variant-numeric: tabular-nums; }
      .section-title { display: flex; align-items: center; padding: 13px 12px 6px; color: var(--tertiary); font-size: 10px; font-weight: 650; letter-spacing: .075em; text-transform: uppercase; }
      .project-list { min-height: 0; overflow: auto; padding: 0 8px; }
      .project-item { padding: 7px 8px; }
      .project-symbol { width: 23px; height: 23px; flex: 0 0 23px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--secondary); font-size: 10px; font-weight: 650; }
      .project-item.active .project-symbol { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); color: var(--accent); }
      .project-item-copy { min-width: 0; display: grid; gap: 2px; }
      .project-item-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--label); font-size: 12px; font-weight: 550; }
      .project-item-path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--tertiary); font-size: 10px; }
      .state-dot { width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: var(--tertiary); }
      .state-dot.ready { background: var(--green); }
      .state-dot.error { background: var(--red); }
      .state-dot.pending { background: var(--amber); }
      .row-dot { display: none; }
      .narrow-search { display: none; margin: 0 0 14px; }
      .narrow-search input { width: 100%; height: 32px; border: 1px solid var(--line-soft); border-radius: 10px; background: var(--surface); padding: 0 10px; color: var(--label); font: 13px var(--sans); }
      .scope-note { color: var(--tertiary); font-size: 11px; margin-right: 6px; }
      .fix-row { display: flex; align-items: center; gap: 8px; }
      .fix-row code { flex: 1; min-width: 0; }
      .copy-btn { flex: 0 0 auto; }
      .notice-close { margin-left: 12px; border: 0; background: transparent; color: inherit; font-size: 16px; line-height: 1; padding: 0 4px; border-radius: 4px; cursor: pointer; }
      .sidebar-foot { margin-top: auto; display: flex; align-items: center; gap: 9px; padding: 14px 16px 16px; color: var(--tertiary); border-top: 1px solid var(--line-soft); font-size: 11px; line-height: 1.6; letter-spacing: .01em; }
      .sidebar-foot::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 var(--green-wash); animation: foot-pulse 2.4s ease-out infinite; }
      @keyframes foot-pulse { 0% { box-shadow: 0 0 0 0 var(--green-wash); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }
      @media (prefers-reduced-motion: reduce) { .sidebar-foot::before { animation: none; } }
      .main { min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
      .toolbar { height: 58px; flex: 0 0 58px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 28px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 72%, transparent); }
      .crumb { min-width: 0; display: flex; align-items: center; gap: 8px; color: var(--secondary); font-size: 12px; }
      .crumb strong { color: var(--label); font-weight: 600; }
      .toolbar-actions { display: flex; align-items: center; gap: 8px; }
      .button { min-height: 29px; border: 1px solid var(--line-soft); border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; background: var(--surface); color: var(--label); font-size: 11px; font-weight: 550; white-space: nowrap; box-shadow: 0 1px 1px #00000008; transition: transform .12s ease, background .15s ease, border-color .15s ease; }
      .button:hover { background: var(--surface-alt); border-color: color-mix(in srgb, var(--secondary) 32%, var(--line)); }
      .button:active { transform: scale(.98); }
      .button:disabled { opacity: .48; cursor: wait; }
      .button[title]:disabled { cursor: not-allowed; }
      .cli-banner a { color: inherit; text-decoration: underline; }
      .cli-banner { position: relative; padding-right: 50px; }
      .cli-banner .cli-copy { position: absolute; top: 7px; right: 8px; }
      .button svg { width: 13px; height: 13px; }
      .button.primary { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); background: var(--accent-wash); color: var(--accent); }
      .button.danger { color: var(--red); }
      .button.quiet { border-color: transparent; background: transparent; box-shadow: none; color: var(--secondary); }
      .content { min-height: 0; flex: 1; overflow: auto; padding: 30px clamp(22px, 4vw, 54px) 46px; }
      .content-inner { max-width: 1160px; margin: 0 auto; }
      .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin: 3px 0 22px; }
      .page-head h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: -.035em; font-weight: 650; }
      .page-head p { max-width: 620px; margin: 6px 0 0; color: var(--secondary); font-size: 12px; line-height: 1.5; }
      .summary { display: flex; align-items: center; gap: 8px; }
      .stat { min-width: 96px; border-left: 1px solid var(--line); padding: 1px 0 1px 12px; }
      .stat:first-child { border: 0; }
      .stat strong { display: block; font-size: 17px; font-variant-numeric: tabular-nums; font-weight: 620; letter-spacing: -.03em; }
      .stat span { display: block; margin-top: 2px; color: var(--secondary); font-size: 10px; }
      .notice { display: none; margin: 0 0 13px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; color: var(--secondary); background: var(--surface); font-size: 12px; }
      .notice.show { display: block; }
      .notice.error { border-color: color-mix(in srgb, var(--red) 35%, var(--line)); color: var(--red); background: var(--red-wash); }
      .list-head { display: flex; align-items: center; justify-content: space-between; padding: 0 12px 7px; color: var(--tertiary); font-size: 10px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; }
      .project-table { display: grid; gap: 8px; overflow: visible; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
      .project-row { min-height: 63px; display: grid; grid-template-columns: minmax(240px, 1.5fr) minmax(125px, .65fr) minmax(112px, .55fr) auto; align-items: center; gap: 16px; padding: 9px 12px; border: 1px solid var(--line-soft); border-radius: 12px; background: var(--surface); box-shadow: 0 1px 2px #17171b08; transition: background .16s ease, border-color .16s ease; }
      .project-row:hover { border-color: var(--line); background: var(--surface-alt); }
      .project-open { min-width: 0; display: flex; align-items: center; gap: 10px; border: 0; padding: 0; text-align: left; background: transparent; }
      .project-open .project-symbol { width: 30px; height: 30px; flex-basis: 30px; border-radius: 8px; font-size: 11px; }
      .row-title { min-width: 0; display: grid; gap: 3px; }
      .row-title strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--label); font-size: 12px; font-weight: 600; }
      .row-title small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--tertiary); font-size: 10px; }
      .status-label { display: inline-flex; align-items: center; gap: 7px; color: var(--secondary); font-size: 11px; }
      .row-meta { color: var(--secondary); font-size: 11px; font-variant-numeric: tabular-nums; }
      .row-actions { display: flex; justify-content: flex-end; gap: 4px; }
      .row-actions .button { min-height: 26px; padding: 0 8px; font-size: 10px; }
      .detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin: 2px 0 19px; }
      .detail-title { min-width: 0; }
      .back-link { border: 0; padding: 0; margin-bottom: 12px; color: var(--secondary); background: none; font-size: 11px; }
      .back-link:hover { color: var(--accent); }
      .detail-title h1 { overflow-wrap: anywhere; margin: 0; font-size: 24px; line-height: 1.15; letter-spacing: -.035em; font-weight: 650; }
      .detail-path { display: block; margin-top: 6px; color: var(--secondary); font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
      .detail-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
      .detail-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 7px 14px; margin: 14px 0 20px; color: var(--secondary); font-size: 11px; }
      .meta-item { display: inline-flex; align-items: center; gap: 6px; }
      .ports { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 19px; }
      .port-chip { border: 1px solid var(--line-soft); border-radius: 8px; padding: 4px 7px; color: var(--secondary); background: var(--surface); font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .port-chip.conflict { border-color: color-mix(in srgb, var(--amber) 37%, var(--line)); color: var(--amber); background: var(--amber-wash); }
      .conflicts { margin: 0 0 19px; border: 1px solid var(--line-soft); border-radius: 11px; background: var(--surface); }
      .conflicts summary { cursor: pointer; padding: 9px 11px; color: var(--amber); font-size: 11px; font-weight: 550; }
      .conflict-body { display: grid; gap: 6px; padding: 0 11px 10px; color: var(--secondary); font-size: 10px; }
      .conflict-claimants { display: grid; gap: 3px; margin: 3px 0 0; padding: 0; list-style: none; }
      .conflict-claimants li { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
      .conflict-claimants code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
      .section-label { display: flex; align-items: center; justify-content: space-between; margin: 21px 0 8px; color: var(--secondary); font-size: 10px; font-weight: 650; letter-spacing: .055em; text-transform: uppercase; }
      .stack-list { display: grid; gap: 7px; }
      .stack { overflow: hidden; border: 1px solid var(--line-soft); border-radius: 12px; background: var(--surface); box-shadow: 0 1px 2px #00000006; }
      .stack-head { min-height: 42px; display: flex; align-items: center; gap: 12px; padding: 6px 9px 6px 12px; }
      .stack-toggle { min-width: 0; flex: 1; display: flex; align-items: center; gap: 8px; border: 0; padding: 0; text-align: left; background: transparent; }
      .chevron { width: 12px; height: 12px; color: var(--tertiary); transition: transform .16s ease; }
      .stack.open .chevron { transform: rotate(90deg); }
      .stack-name { color: var(--label); font-size: 11px; font-weight: 600; }
      .stack-count { color: var(--tertiary); font-size: 10px; }
      .stack-quick { display: flex; gap: 4px; }
      .stack-quick .button { min-height: 24px; padding: 0 7px; border-color: transparent; box-shadow: none; background: transparent; color: var(--secondary); font-size: 10px; }
      .stack-quick .button:hover { border-color: var(--line); background: var(--surface-alt); color: var(--label); }
      .resource-list { display: none; padding: 7px 8px 8px; border-top: 1px solid var(--line-soft); }
      .stack.open .resource-list { display: block; }
      .resource-row { min-height: 43px; display: grid; grid-template-columns: minmax(140px, .8fr) minmax(88px, .45fr) minmax(140px, 1fr) auto; align-items: center; gap: 10px; margin-top: 5px; padding: 6px 10px 6px 25px; border: 1px solid var(--line-soft); border-radius: 9px; background: color-mix(in srgb, var(--surface-alt) 72%, transparent); }
      .resource-row:first-child { margin-top: 0; }
      .resource-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--label); font-size: 11px; font-weight: 550; }
      .resource-type { display: block; overflow: hidden; margin-top: 2px; color: var(--tertiary); font-size: 9px; font-weight: 400; text-overflow: ellipsis; }
      .resource-url { overflow: hidden; color: var(--accent); font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; text-overflow: ellipsis; white-space: nowrap; text-decoration: none; }
      .resource-url:hover { text-decoration: underline; }
      .resource-actions { display: flex; justify-content: flex-end; gap: 3px; }
      .resource-actions .button { min-height: 24px; padding: 0 7px; border-color: transparent; background: transparent; box-shadow: none; color: var(--secondary); font-size: 10px; }
      .resource-actions .button:hover { border-color: var(--line); background: var(--surface-alt); color: var(--label); }
      .empty { display: grid; justify-items: center; padding: 76px 24px; border: 1px dashed var(--line); border-radius: 10px; color: var(--secondary); text-align: center; }
      .empty-icon { width: 38px; height: 38px; display: grid; place-items: center; margin-bottom: 13px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--tertiary); font-size: 16px; }
      .empty strong { margin-bottom: 5px; color: var(--label); font-size: 14px; font-weight: 600; }
      .empty p { max-width: 400px; margin: 0; font-size: 11px; line-height: 1.55; }
      .loading { padding: 28px 12px; color: var(--secondary); font-size: 12px; }
      .modal { width: min(850px, 92vw); max-height: 80vh; padding: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--label); box-shadow: var(--shadow); }
      .modal::backdrop { background: #0005; backdrop-filter: blur(3px); }
      .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; border-bottom: 1px solid var(--line); }
      .modal-head h2 { margin: 0; font-size: 12px; font-weight: 600; }
      .modal-actions { display: flex; align-items: center; gap: 6px; }
      .copy-icon { width: 30px; height: 30px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 7px; background: transparent; color: var(--secondary); }
      .copy-icon:hover { background: var(--surface-alt); color: var(--label); }
      .copy-icon svg { width: 16px; height: 16px; }
      .modal pre { max-height: calc(80vh - 48px); margin: 0; padding: 14px; overflow: auto; color: var(--secondary); font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
      @media (max-width: 840px) {
        :root { --sidebar-width: 216px; }
        .toolbar { padding-inline: 18px; }
        .content { padding-inline: 18px; }
        .project-row { grid-template-columns: minmax(180px, 1fr) minmax(100px, .55fr) auto; }
        .row-meta.resources-count .res-text { display: none; }
        .row-meta.resources-count:empty { display: none; }
      }
      @media (max-width: 640px) {
        body { min-height: 420px; }
        .app { grid-template-columns: 1fr; }
        .sidebar { display: none; }
        .narrow-search { display: block; }
        .toolbar { height: 50px; flex-basis: 50px; padding-inline: 14px; }
        .content { padding: 21px 13px 32px; }
        .page-head { align-items: flex-start; flex-direction: column; gap: 14px; }
        .summary { width: 100%; justify-content: space-between; }
        .stat { flex: 1; }
        .project-row { grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
        .project-row > .status-label { display: none; }
        .project-row > .row-meta .res-text { display: none; }
        .project-row > .row-meta:empty { display: none; }
        .row-dot { display: block; position: absolute; right: -2px; bottom: -2px; box-shadow: 0 0 0 2px var(--surface); }
        .project-symbol { position: relative; }
        .row-actions .button { padding-inline: 6px; }
        .detail-head { flex-direction: column; }
        .detail-actions { justify-content: flex-start; }
        .resource-row { grid-template-columns: minmax(110px, .8fr) auto; gap: 6px; padding-left: 14px; }
        .resource-row > .status-label { display: none; }
        .resource-row > .resource-url { grid-column: 1 / -1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .resource-name .row-dot { display: inline-block; position: static; margin-right: 6px; vertical-align: middle; box-shadow: none; }
      }

      /* Theme: Codex layout, Claude warmth and type. Sizes and contrast chosen for readability. */
      :root {
        color-scheme: light dark;
        --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
        --serif: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, monospace;
        font-family: var(--sans);
        font-size: 15px;
        --canvas: #faf9f5; --sidebar: #f0eee6; --surface: #ffffff; --surface-alt: #f3f1ea; --raised: #fff;
        --label: #141413; --secondary: #4d4c48; --tertiary: #6b6a64;
        --line: #d9d5c8; --line-soft: #e6e2d6;
        --accent: #b4532f; --accent-wash: #f6e4dc;
        --green: #26693f; --green-wash: #e0f0e5; --amber: #8a5a00; --amber-wash: #fbefcf; --red: #b0302b; --red-wash: #fbe3e1;
        --shadow: none;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #262624; --sidebar: #1f1e1d; --surface: #30302e; --surface-alt: #3a3a37; --raised: #3a3a37;
          --label: #faf9f5; --secondary: #cfcdc3; --tertiary: #a8a69c;
          --line: #4a4943; --line-soft: #3d3c37;
          --accent: #e08a68; --accent-wash: #4a3228;
          --green: #7fd69f; --green-wash: #1f3a2a; --amber: #efc15f; --amber-wash: #3d3118; --red: #f5958f; --red-wash: #4a2523;
        }
      }
      body { font-size: 15px; line-height: 1.45; }
      button, input { font-size: inherit; }
      button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* Sidebar: plain, Codex-like list */
      .sidebar { background: var(--sidebar); border-right: 1px solid var(--line); }
      .brand { border-bottom: 0; padding: 30px 18px 0; height: 76px; }
      .brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: #fff; font: 700 15px var(--sans); }
      .brand-name { font: 600 16px var(--sans); letter-spacing: -.01em; }
      .sidebar-tools { padding: 14px 12px 8px; }
      .search input { height: 36px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 14px; padding-left: 32px; }
      .search input::placeholder { color: var(--tertiary); }
      .search svg { top: 11px; width: 15px; height: 15px; }
      .nav-item, .project-item { border-radius: 8px; color: var(--secondary); font-size: 14px; }

      /* Main area */

      /* Buttons: clearly readable and clickable */

      /* Detail */

      .stack-quick .button, .resource-actions .button { min-height: 32px; padding: 0 12px; font-size: 13px; border-color: var(--line); background: var(--surface); color: var(--label); }
      .stack-quick .button:hover, .resource-actions .button:hover { background: var(--surface-alt); border-color: var(--tertiary); }
      .stack-quick .button.primary, .resource-actions .button.primary { background: var(--accent-wash); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
      .resource-list { padding: 4px 12px 12px; border-top: 1px solid var(--line); }
      .resource-row { grid-template-columns: minmax(160px, .9fr) 110px minmax(150px, 1fr) auto; min-height: 56px; padding: 8px 8px 8px 26px; gap: 14px; border: 0; border-bottom: 1px solid var(--line-soft); border-radius: 0; background: transparent; margin-top: 0; }
      .resource-row:last-child { border-bottom: 0; }
      .resource-name { font-size: 15px; font-weight: 500; }

      .resource-url { font: 13px var(--mono); color: var(--accent); }

      /* Messages */
      .notice { font-size: 14px; border-radius: 10px; padding: 12px 14px; color: var(--label); background: var(--surface); border-color: var(--line); }

      .cli-banner a { color: var(--accent); font-weight: 500; }

      .modal { border-radius: 12px; }
      .modal-head h2 { font: 600 15px var(--sans); }
      .modal pre { font: 13px/1.6 var(--mono); color: var(--label); }
      /* Doctor score */
      .score { justify-self: start; min-width: 58px; display: inline-flex; align-items: baseline; justify-content: center; gap: 1px; padding: 4px 10px; border-radius: 999px; font: 600 15px var(--sans); border: 1px solid var(--line); background: var(--surface-alt); color: var(--secondary); }
      .score small { font-size: 11px; font-weight: 500; opacity: .75; }

      .score.warn { background: var(--amber-wash); color: var(--amber); border-color: color-mix(in srgb, var(--amber) 40%, var(--line)); }
      .score.bad { background: var(--red-wash); color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, var(--line)); }
      .doctor-box { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 14px 16px; display: grid; gap: 10px; font-size: 14px; color: var(--secondary); }
      .doctor-summary { display: flex; align-items: center; gap: 12px; color: var(--label); }
      .doctor-item { display: grid; gap: 4px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line-soft); background: var(--surface-alt); }
      .doctor-item strong { color: var(--label); font-weight: 600; }
      .doctor-item.fail { border-left: 3px solid var(--red); }
      .doctor-item.warning { border-left: 3px solid var(--amber); }
      .doctor-item.pass { border-left: 3px solid var(--green); }
      .doctor-item span { white-space: pre-wrap; }
      .doctor-item code { font: 12px/1.5 var(--mono); color: var(--label); white-space: pre-wrap; }
      .project-row { grid-template-columns: minmax(200px, 1.5fr) 110px 92px minmax(110px, .7fr) auto; }
      /* Native window: let macOS vibrancy show through, with frosted glass panels */
      html.native, html.native body { background: transparent; }
      html.native { --glass: rgba(255, 255, 255, .55); --glass-strong: rgba(255, 255, 255, .72); --glass-line: rgba(255, 255, 255, .6); --glass-shadow: 0 1px 2px rgba(20, 20, 19, .06), 0 10px 30px rgba(20, 20, 19, .08); --side-glass: rgba(246, 244, 238, .38); }
      @media (prefers-color-scheme: dark) {
        html.native { --glass: rgba(255, 255, 255, .08); --glass-strong: rgba(255, 255, 255, .13); --glass-line: rgba(255, 255, 255, .14); --glass-shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 12px 32px rgba(0, 0, 0, .28); --side-glass: rgba(20, 20, 22, .30); }
      }
      /* Subtle ambient glow behind the glass */
      html.native body::before { content: ""; position: fixed; inset: -10%; z-index: -1; pointer-events: none; filter: blur(60px) saturate(1.3);
        background:
          radial-gradient(38% 42% at 78% 12%, rgba(255, 122, 89, 0.15), transparent 70%),
          radial-gradient(40% 46% at 92% 78%, rgba(150, 99, 255, 0.13), transparent 70%),
          radial-gradient(42% 44% at 38% 96%, rgba(56, 189, 248, 0.11), transparent 70%),
          radial-gradient(34% 38% at 22% 8%, rgba(255, 92, 170, 0.09), transparent 70%); }
      @media (prefers-color-scheme: dark) {
        html.native body::before { filter: blur(70px) saturate(1.5);
          background:
            radial-gradient(38% 42% at 78% 12%, rgba(255, 110, 80, 0.12), transparent 70%),
            radial-gradient(40% 46% at 92% 78%, rgba(140, 90, 255, 0.15), transparent 70%),
            radial-gradient(42% 44% at 38% 96%, rgba(40, 160, 235, 0.10), transparent 70%),
            radial-gradient(34% 38% at 22% 8%, rgba(236, 72, 153, 0.09), transparent 70%); }
      }
      .native .sidebar { background: var(--side-glass); border-right: 1px solid var(--glass-line); backdrop-filter: blur(30px) saturate(1.6); -webkit-backdrop-filter: blur(30px) saturate(1.6); }
      .native .search input { background: var(--glass); border-color: var(--glass-line); }
      .native .nav-item.active, .native .project-item.active { background: var(--glass-strong); box-shadow: 0 0 0 1px var(--glass-line), var(--glass-shadow); }
      .native .nav-item:hover, .native .project-item:hover { background: var(--glass); }
      .native .project-row, .native .stack, .native .doctor-box, .native .notice, .native .conflicts, .native .empty, .native .modal { background: var(--glass); border: 1px solid var(--glass-line); border-radius: 16px; box-shadow: var(--glass-shadow); backdrop-filter: blur(24px) saturate(1.5); -webkit-backdrop-filter: blur(24px) saturate(1.5); }
      .native .project-row:hover { background: var(--glass-strong); border-color: var(--glass-line); }
      .native .notice.error { background: color-mix(in srgb, var(--red-wash) 80%, transparent); }
      .native .doctor-item { background: var(--glass); border-color: var(--glass-line); }
      .native .resource-row { border-bottom-color: var(--glass-line); }
      .native .resource-list, .native .stack-head { background: transparent; }
      .native .button { background: var(--glass); border-color: var(--glass-line); backdrop-filter: blur(12px); border-radius: 10px; }
      .native .button:hover { background: var(--glass-strong); }
      .native .button.primary { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 88%, #fff), var(--accent)); border-color: transparent; color: #fff; box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent); }
      @media (prefers-color-scheme: dark) { .native .button.primary { color: #1b1a19; } }
      .native .button.quiet { background: transparent; border-color: transparent; }
      .native .project-symbol { border-radius: 12px; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 28%, transparent), color-mix(in srgb, var(--accent) 10%, transparent)); }
      .native .score { backdrop-filter: blur(10px); }
      .native .brand-mark { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 85%, #fff), var(--accent)); border-radius: 9px; box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 35%, transparent); }
      .native ::-webkit-scrollbar { width: 10px; }
      .native ::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, .35); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
      /* Loading skeletons */
      @keyframes shimmer { 0% { background-position: 120% 0; } 100% { background-position: -120% 0; } }
      .skel-title, .skel-sub, .skel-row, .skel-side i { border-radius: 10px; background: linear-gradient(100deg, var(--surface-alt) 30%, var(--surface) 50%, var(--surface-alt) 70%); background-size: 240% 100%; animation: shimmer 1.2s linear infinite; }
      .skel-title { width: 220px; height: 34px; margin-bottom: 12px; }
      .skel-sub { width: 360px; max-width: 80%; height: 16px; margin-bottom: 28px; }
      .skel-row { height: 76px; margin-bottom: 10px; border-radius: 16px; }
      .skel-side { display: grid; gap: 8px; padding: 6px 4px; }
      .skel-side i { display: block; height: 34px; }
      @media (prefers-reduced-motion: reduce) { .skel-title, .skel-sub, .skel-row, .skel-side i { animation: none; } }
      @media (max-width: 840px) { .project-row { grid-template-columns: minmax(180px, 1fr) 92px auto; } .project-row > .status-label { display: none; } }

      /* System palette: macOS colours, consistent everywhere (loaded last on purpose) */
      :root {
        --canvas: #f5f5f7; --sidebar: #ececf0; --surface: #ffffff; --surface-alt: #f2f2f7; --raised: #fff;
        --label: #1d1d1f; --secondary: rgba(60, 60, 67, .82); --tertiary: rgba(60, 60, 67, .75);
        --line: rgba(60, 60, 67, .2); --line-soft: rgba(60, 60, 67, .12);
        --accent: #0071e3; --accent-wash: rgba(0, 113, 227, .12);
        --green: #1d8a3a; --green-wash: rgba(52, 199, 89, .16); --amber: #9a5b00; --amber-wash: rgba(255, 159, 10, .18); --red: #c4271c; --red-wash: rgba(255, 69, 58, .14);
        --g-ring: #34c759; --a-ring: #ff9f0a; --r-ring: #ff3b30; --track: rgba(60, 60, 67, .14);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #1e1e1e; --sidebar: #252528; --surface: #2c2c2e; --surface-alt: #3a3a3c; --raised: #3a3a3c;
          --label: #f5f5f7; --secondary: rgba(235, 235, 245, .78); --tertiary: rgba(235, 235, 245, .6);
          --line: rgba(235, 235, 245, .2); --line-soft: rgba(235, 235, 245, .12);
          --accent: #0a84ff; --accent-wash: rgba(10, 132, 255, .2);
          --green: #32d74b; --green-wash: rgba(48, 209, 88, .18); --amber: #ffb340; --amber-wash: rgba(255, 159, 10, .2); --red: #ff6961; --red-wash: rgba(255, 69, 58, .2);
          --g-ring: #30d158; --a-ring: #ff9f0a; --r-ring: #ff453a; --track: rgba(235, 235, 245, .16);
        }
      }
      html.native body::before { display: none; }
      .button.primary, .native .button.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: none; filter: none; }
      .button.primary:hover { filter: brightness(1.08); }
      @media (prefers-color-scheme: dark) { .button.primary, .native .button.primary { color: #fff; } }
      .brand-mark, .native .brand-mark { background: var(--accent); box-shadow: none; color: #fff; }
      .project-symbol, .native .project-symbol { background: var(--accent-wash); color: var(--accent); }
      .stack-quick .button.primary, .resource-actions .button.primary { background: var(--accent-wash); color: var(--accent); border-color: transparent; }
      .nav-item.active, .project-item.active { box-shadow: none; background: var(--accent-wash); color: var(--label); }
      .native .nav-item.active, .native .project-item.active { background: var(--accent-wash); box-shadow: none; }

      /* Rings and gauges */
      .ring { position: relative; display: inline-grid; place-items: center; flex: none; }
      .ring svg { position: absolute; inset: 0; }
      .ring b { position: relative; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; color: var(--label); }
      .ring-track { stroke: var(--track); }
      .ring-fill { stroke: var(--tertiary); transition: stroke-dasharray .5s ease; }
      .ring.good .ring-fill { stroke: var(--g-ring); }
      .ring.warn .ring-fill { stroke: var(--a-ring); }
      .ring.bad .ring-fill { stroke: var(--r-ring); }
      .gauges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 0 0 28px; }
      .gauge { display: flex; align-items: center; gap: 16px; padding: 16px 18px; border: 1px solid var(--line-soft); border-radius: 16px; background: var(--surface); }
      .native .gauge { background: var(--glass); border-color: var(--glass-line); box-shadow: var(--glass-shadow); backdrop-filter: blur(24px) saturate(1.5); -webkit-backdrop-filter: blur(24px) saturate(1.5); }
      .gauge strong { display: block; font-size: 15px; font-weight: 600; }
      .gauge span { display: block; margin-top: 3px; font-size: 13px; color: var(--secondary); }
      .score { all: unset; }
      .doctor-summary { gap: 18px; }
      .doctor-meta { display: grid; gap: 6px; flex: 1; min-width: 0; }
      .doctor-meta strong { font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
      .doctor-meta span { font-size: 14px; color: var(--secondary); }
      .bar { display: flex; gap: 3px; height: 8px; border-radius: 99px; overflow: hidden; background: var(--track); max-width: 420px; }
      .bar i { display: block; min-width: 6px; border-radius: 99px; }
      .bar .pass { background: var(--g-ring); } .bar .warning { background: var(--a-ring); } .bar .fail { background: var(--r-ring); }
      .project-row { grid-template-columns: minmax(200px, 1.5fr) 110px 56px minmax(110px, .7fr) auto; }
      .project-row > .ring { justify-self: center; }
      @media (max-width: 840px) { .gauges { grid-template-columns: 1fr; } }
      .token-bar { display: flex; align-items: center; gap: 14px; margin: -12px 0 28px; padding: 14px 18px; border: 1px solid var(--line-soft); border-radius: 16px; background: var(--surface); }
      .token-bar.inline { margin: 4px 0 20px; }
      .token-copy { flex: 0 1 260px; min-width: 0; }
      .token-copy strong { display: block; font-size: 15px; font-weight: 600; }
      .token-copy span { display: block; margin-top: 3px; font-size: 13px; color: var(--secondary); }
      .token-track { flex: 1; height: 10px; border-radius: 999px; background: var(--c-track); overflow: hidden; }
      .token-track i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width 0.3s; }
      .token-bar b { min-width: 3.2em; text-align: right; font-size: 15px; font-variant-numeric: tabular-nums; }
      @media (max-width: 560px) { .token-bar { flex-wrap: wrap; } .token-copy { flex-basis: 100%; } .token-track { flex-basis: 100%; order: 3; } }

      /* Collapsible panels, one consistent header everywhere */
      .panel { margin: 0 0 24px; }
      .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; margin: 0 0 10px; }
      .panel-toggle { display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 0; border: 0; background: none; color: var(--label); font: 600 15px var(--sans); text-align: left; }
      .panel-toggle:hover { color: var(--accent); }
      .panel-right { color: var(--secondary); font-size: 13px; }
      .panel .chevron, .section-toggle .chevron, .stack .chevron { width: 14px; height: 14px; color: var(--secondary); transition: transform .18s ease; }
      .panel:not(.collapsed) > .panel-head .chevron, .section-toggle[aria-expanded="true"] .chevron { transform: rotate(90deg); }
      .panel.collapsed > .panel-body { display: none; }
      .section-toggle { width: 100%; display: flex; align-items: center; gap: 6px; border: 0; background: none; text-align: left; }
      .section-toggle:hover { color: var(--label); }
      .ws-collapsed .project-list { display: none; }
      .side-toggle { position: fixed; top: 6px; left: 86px; z-index: 20; width: 30px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--secondary); }
      .side-toggle:hover { background: var(--surface-alt); color: var(--label); }
      .side-toggle svg { width: 18px; height: 18px; }
      /* The sidebar is hidden at 640px and below, so there is nothing for the toggle to open. */
      @media (max-width: 640px) { .side-toggle { display: none; } }
      .app.side-hidden { grid-template-columns: 0 minmax(0, 1fr); }
      .app.side-hidden .sidebar { visibility: hidden; overflow: hidden; }
      .stack-head { min-height: 48px; }
      .stack-name { font: 600 15px var(--sans); }

      /* Ring numbers are SVG text so they are centred exactly */
      .ring { display: inline-block; line-height: 0; }
      .ring svg { position: static; display: block; }
      .ring text { fill: var(--label); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }

      /* Icon rail: sidebar collapses to icons */
      .app.rail { grid-template-columns: 68px minmax(0, 1fr); }
      .project-item .project-symbol { display: none; }
      .rail .brand { padding: 30px 0 0; justify-content: center; }
      .rail .brand-name, .rail .local-mark, .rail .search, .rail .section-title, .rail .nav-label, .rail .project-item-name, .rail .sidebar-foot, .rail .nav-item .count { display: none; }
      .rail .sidebar-tools { padding: 8px 0; }
      .rail .side-nav, .rail .project-list { padding-inline: 12px; }
      .rail .nav-item, .rail .project-item { justify-content: center; padding: 9px 0; }
      .rail .project-item .project-symbol { display: grid; }
      .app.rail .sidebar.ws-collapsed .project-list { display: block; }
      .app.side-hidden { grid-template-columns: 258px minmax(0, 1fr); }
      .app.side-hidden .sidebar { visibility: visible; }

      /* Forms */
      .form-modal { width: min(520px, 92vw); }
      .form { display: grid; }
      .form-body { display: grid; gap: 14px; padding: 18px; max-height: 70vh; overflow: auto; }

      .danger-link { color: var(--red, #d70015); }
      .tool-result { display: grid; gap: 6px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); font-size: 13px; }
      .tool-result.ok { border-color: var(--green, #248a3d); }

      .tool-result code { font-size: 12px; color: var(--secondary); overflow-wrap: anywhere; }
      .tool-result pre { margin: 0; max-height: 220px; overflow: auto; white-space: pre-wrap; font-size: 12px; }
      .config-box { display: grid; gap: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
      .config-summary { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .config-when { font-size: 13px; color: var(--secondary); }
      .log-title { font: 600 13px var(--sans); color: var(--secondary); }
      .log-list { display: grid; gap: 6px; max-height: 320px; overflow: auto; }
      .log-empty { font-size: 13px; color: var(--secondary); padding: 6px 0; }
      .log-entry { border: 1px solid var(--line-soft); border-radius: 6px; background: var(--surface-alt); }
      .log-entry summary { display: flex; align-items: center; gap: 12px; padding: 7px 10px; cursor: pointer; font-size: 13px; list-style: none; }
      .log-entry summary::-webkit-details-marker { display: none; }
      .log-entry summary::before { content: "›"; color: var(--tertiary); transition: transform .12s ease; display: inline-block; width: 8px; }
      .log-entry[open] summary::before { transform: rotate(90deg); }
      .log-when { color: var(--secondary); font-variant-numeric: tabular-nums; }
      .log-action { font-weight: 600; text-transform: capitalize; }
      .log-exit { margin-left: auto; font-variant-numeric: tabular-nums; }
      .log-entry.ok .log-exit { color: var(--green); }
      .log-entry.fail .log-exit { color: var(--red); }
      .log-output-row { position: relative; }
      .log-output-row pre { padding-right: 42px; }
      .log-output-row .copy-icon { position: absolute; top: 4px; right: 4px; }
      .log-ms { color: var(--tertiary); font-variant-numeric: tabular-nums; }
      .log-entry pre { margin: 0; padding: 8px 10px 10px; font: 12px/1.5 var(--mono); white-space: pre-wrap; color: var(--label); max-height: 240px; overflow: auto; border-top: 1px solid var(--line-soft); }
      /* "Inspect with" links: the brand colours of the PR review badges, as plain links so they work offline and under the CSP. */
      .ai-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
      .ai-label { margin-right: 2px; font-size: 12px; color: var(--secondary); }
      .ai-btn { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--ai); color: #fff; font: 600 12px var(--sans); text-decoration: none; white-space: nowrap; transition: filter .12s ease, transform .12s ease; }
      .ai-btn:hover { filter: brightness(1.12); }
      .ai-btn:active { transform: scale(.98); }
      .ai-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .ai-btn svg { width: 13px; height: 13px; flex: 0 0 13px; }
      #log-ai { display: grid; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line-soft); }
      #log-ai ~ #log-body { max-height: calc(80vh - 120px); }
      .ai-switch-row { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; }
      .ai-switch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--label); cursor: pointer; }
      .ai-switch input { margin: 0; width: 14px; height: 14px; accent-color: var(--accent); cursor: pointer; }
      .ai-hint { font-size: 11px; color: var(--secondary); }
      .log-entry .ai-row { padding: 8px 10px 10px; border-top: 1px solid var(--line-soft); }
      .doctor-box > .ai-row { padding-top: 4px; }

      /* ===== Chart palette: soft glass tones instead of saturated system colours (loaded last) ===== */
      :root { --c-good-a: #6fb59a; --c-good-b: #a6dcc3; --c-warn-a: #d8a25e; --c-warn-b: #efcb8e; --c-bad-a: #d88a8a; --c-bad-b: #efb0aa; --c-none-a: #b4b4bb; --c-none-b: #d7d7dc;
        --c-track: rgba(60, 60, 67, .1); --c-text-good: #2f6e55; --c-text-warn: #8a5f20; --c-text-bad: #9a4a4a; --c-wash-good: rgba(111, 181, 154, .16); --c-wash-warn: rgba(216, 162, 94, .18); --c-wash-bad: rgba(216, 138, 138, .16); }
      @media (prefers-color-scheme: dark) { :root { --c-good-a: #7fcfae; --c-good-b: #b8e9d6; --c-warn-a: #e6b872; --c-warn-b: #f4d9a6; --c-bad-a: #e89a94; --c-bad-b: #f5c4bf; --c-none-a: #7d7d85; --c-none-b: #9c9ca4;
        --c-track: rgba(235, 235, 245, .12); --c-text-good: #a6dfc8; --c-text-warn: #f0d08f; --c-text-bad: #f2b0aa; --c-wash-good: rgba(127, 207, 174, .16); --c-wash-warn: rgba(230, 184, 114, .16); --c-wash-bad: rgba(232, 154, 148, .16); } }

      .ring { --ring-a: var(--c-none-a); --ring-b: var(--c-none-b); }
      .ring.good { --ring-a: var(--c-good-a); --ring-b: var(--c-good-b); }
      .ring.warn { --ring-a: var(--c-warn-a); --ring-b: var(--c-warn-b); }
      .ring.bad { --ring-a: var(--c-bad-a); --ring-b: var(--c-bad-b); }
      .ring.none { --ring-a: var(--c-none-a); --ring-b: var(--c-none-b); }
      .ring-track { stroke: var(--c-track); }
      .ring-fill { filter: none; transition: stroke-dasharray .6s cubic-bezier(.2, .8, .3, 1); opacity: .92; }
      .ring-num { fill: var(--label); font-weight: 500; }

      .bar { background: var(--c-track); height: 8px; }
      .bar .pass { background: linear-gradient(90deg, var(--c-good-a), var(--c-good-b)); }
      .bar .warning { background: linear-gradient(90deg, var(--c-warn-a), var(--c-warn-b)); }
      .bar .fail { background: linear-gradient(90deg, var(--c-bad-a), var(--c-bad-b)); }
      .legend .pass { background: var(--c-good-a); } .legend .warning { background: var(--c-warn-a); } .legend .fail { background: var(--c-bad-a); }

      .badge.good { background: var(--c-wash-good); color: var(--c-text-good); }
      .badge.bad { background: var(--c-wash-bad); color: var(--c-text-bad); }
      .badge.warn { background: var(--c-wash-warn); color: var(--c-text-warn); }
      .badge.none { background: var(--surface-alt); color: var(--secondary); }
      .button.danger, .native .button.danger, .row-actions .button.danger { color: var(--c-text-bad); background: var(--c-wash-bad); box-shadow: 0 0 0 .5px color-mix(in srgb, var(--c-bad-a) 45%, transparent), var(--gb-hi); }
      .log-entry.ok .log-exit { color: var(--c-text-good); }
      .log-entry.fail .log-exit { color: var(--c-text-bad); }
      .score { background: var(--c-wash-good); }
      .doctor-item.fail { border-left-color: var(--c-bad-a); }
      .doctor-item.warning { border-left-color: var(--c-warn-a); }
      .doctor-item.pass { border-left-color: var(--c-good-a); }
      .gauge { background: var(--gb-bg); backdrop-filter: var(--gb-blur); -webkit-backdrop-filter: var(--gb-blur); box-shadow: 0 0 0 .5px var(--gb-edge), var(--gb-shadow); border-color: transparent; }
      .project-row, .stack, .doctor-box, .config-box, .tools-box, .conflicts { background: var(--gb-bg); backdrop-filter: var(--gb-blur); -webkit-backdrop-filter: var(--gb-blur); border-color: transparent; box-shadow: 0 0 0 .5px var(--gb-edge), var(--gb-shadow); }

      /* ===== Liquid-glass buttons: clear fill, specular rim, top sheen (loaded last) ===== */
      :root { --lg-fill: rgba(255, 255, 255, .34); --lg-fill-hover: rgba(255, 255, 255, .5); --lg-fill-press: rgba(255, 255, 255, .22);
        --lg-sheen: linear-gradient(180deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, .08) 52%, rgba(255, 255, 255, 0) 53%);
        --lg-rim: linear-gradient(140deg, rgba(255, 255, 255, .95), rgba(255, 255, 255, .25) 35%, rgba(255, 255, 255, .08) 60%, rgba(255, 255, 255, .55));
        --lg-shadow: 0 1px 1px rgba(20, 20, 30, .06), 0 4px 14px rgba(20, 20, 30, .1); --lg-inner: inset 0 -1px 1px rgba(20, 20, 30, .06);
        --lg-blur: blur(24px) saturate(200%) brightness(1.04); }
      @media (prefers-color-scheme: dark) { :root { --lg-fill: rgba(255, 255, 255, .09); --lg-fill-hover: rgba(255, 255, 255, .15); --lg-fill-press: rgba(255, 255, 255, .05);
        --lg-sheen: linear-gradient(180deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .03) 52%, rgba(255, 255, 255, 0) 53%);
        --lg-rim: linear-gradient(140deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, .12) 35%, rgba(255, 255, 255, .04) 60%, rgba(255, 255, 255, .28));
        --lg-shadow: 0 1px 1px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .35); --lg-inner: inset 0 -1px 1px rgba(0, 0, 0, .25);
        --lg-blur: blur(24px) saturate(180%) brightness(1.08); } }

      .button, .native .button {
        border: 1px solid transparent;
        background: var(--lg-sheen) padding-box, linear-gradient(var(--lg-fill), var(--lg-fill)) padding-box, var(--lg-rim) border-box;
        backdrop-filter: var(--lg-blur); -webkit-backdrop-filter: var(--lg-blur);
        box-shadow: var(--lg-shadow), var(--lg-inner); color: var(--label); filter: none;
        transition: transform .14s cubic-bezier(.3, 1.4, .5, 1), background .18s ease, box-shadow .18s ease; }
      .button:hover:not(:disabled), .native .button:hover:not(:disabled) {
        background: var(--lg-sheen) padding-box, linear-gradient(var(--lg-fill-hover), var(--lg-fill-hover)) padding-box, var(--lg-rim) border-box; filter: none; transform: translateY(-.5px); }
      .button:active:not(:disabled), .native .button:active:not(:disabled) {
        background: linear-gradient(var(--lg-fill-press), var(--lg-fill-press)) padding-box, var(--lg-rim) border-box;
        transform: scale(.955); box-shadow: inset 0 1px 4px rgba(0, 0, 0, .18); filter: none; }
      .button:focus-visible { outline: none; box-shadow: var(--lg-shadow), 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }

      /* Tinted glass for the main action */
      .button.primary, .native .button.primary {
        color: #fff; text-shadow: 0 1px 1px rgba(0, 40, 120, .25);
        background: var(--lg-sheen) padding-box, linear-gradient(180deg, color-mix(in srgb, var(--accent) 72%, transparent), color-mix(in srgb, var(--accent) 60%, transparent)) padding-box, var(--lg-rim) border-box;
        box-shadow: 0 4px 16px color-mix(in srgb, var(--accent) 30%, transparent), var(--lg-inner); }
      .button.primary:hover:not(:disabled), .native .button.primary:hover:not(:disabled) {
        background: var(--lg-sheen) padding-box, linear-gradient(180deg, color-mix(in srgb, var(--accent) 84%, transparent), color-mix(in srgb, var(--accent) 72%, transparent)) padding-box, var(--lg-rim) border-box; }
      .button.primary:active:not(:disabled), .native .button.primary:active:not(:disabled) {
        background: linear-gradient(color-mix(in srgb, var(--accent) 66%, transparent), color-mix(in srgb, var(--accent) 66%, transparent)) padding-box, var(--lg-rim) border-box; }

      /* Soft rose glass for Stop */
      .button.danger, .native .button.danger, .row-actions .button.danger {
        color: var(--c-text-bad);
        background: var(--lg-sheen) padding-box, linear-gradient(var(--c-wash-bad), var(--c-wash-bad)) padding-box, var(--lg-rim) border-box; }

      /* Quiet buttons and links stay clear until hovered */
      .button.quiet, .native .button.quiet { border-color: transparent; background: transparent; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
      .button.quiet:hover:not(:disabled), .native .button.quiet:hover:not(:disabled) {
        background: var(--lg-sheen) padding-box, linear-gradient(var(--lg-fill), var(--lg-fill)) padding-box, var(--lg-rim) border-box; box-shadow: var(--lg-shadow); backdrop-filter: var(--lg-blur); -webkit-backdrop-filter: var(--lg-blur); }
      .link-btn { border: 1px solid transparent; }
      .link-btn:hover { background: linear-gradient(color-mix(in srgb, var(--accent) 12%, transparent), color-mix(in srgb, var(--accent) 12%, transparent)) padding-box, var(--lg-rim) border-box; }
      .icon-btn { border: 1px solid transparent; }
      .icon-btn:hover { background: var(--lg-sheen) padding-box, linear-gradient(var(--lg-fill), var(--lg-fill)) padding-box, var(--lg-rim) border-box; box-shadow: var(--lg-shadow); backdrop-filter: var(--lg-blur); -webkit-backdrop-filter: var(--lg-blur); }

      /* Start / Stop / Restart: one glass capsule holding clear segments */
      .row-actions {
        border: 1px solid transparent; padding: 2px; gap: 2px; border-radius: 9px;
        background: var(--lg-sheen) padding-box, linear-gradient(var(--lg-fill), var(--lg-fill)) padding-box, var(--lg-rim) border-box;
        backdrop-filter: var(--lg-blur); -webkit-backdrop-filter: var(--lg-blur); box-shadow: var(--lg-shadow), var(--lg-inner); }
      .row-actions .button, .row-actions .button:first-child, .row-actions .button:last-child { border-radius: 6px; border-color: transparent; background: transparent; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
      .row-actions .button:hover:not(:disabled) { background: linear-gradient(var(--lg-fill-hover), var(--lg-fill-hover)); transform: none; }
      .row-actions .button.primary { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 78%, transparent), color-mix(in srgb, var(--accent) 64%, transparent)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35); }
      .row-actions .button.primary:hover:not(:disabled) { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 90%, transparent), color-mix(in srgb, var(--accent) 76%, transparent)); }
      .row-actions .button.danger { background: linear-gradient(var(--c-wash-bad), var(--c-wash-bad)); }
      .row-actions .button:active:not(:disabled) { transform: scale(.95); }

      /* ===== Cooler accent, deeper see-through glass, tactile press (loaded last) ===== */
      :root { --accent: #5856d6; --accent-wash: rgba(88, 86, 214, .14); --cool-a: #2fc2d8; --cool-b: #5f5bdc;
        --lg-fill: rgba(255, 255, 255, .22); --lg-fill-hover: rgba(255, 255, 255, .36); --lg-fill-press: rgba(255, 255, 255, .14);
        --lg-shadow: 0 1px 2px rgba(20, 20, 40, .1), 0 8px 24px rgba(20, 20, 40, .16), 0 2px 6px rgba(20, 20, 40, .08); }
      @media (prefers-color-scheme: dark) { :root { --accent: #8a87ff; --accent-wash: rgba(138, 135, 255, .18); --cool-a: #44d4e6; --cool-b: #7471ff;
        --lg-fill: rgba(255, 255, 255, .06); --lg-fill-hover: rgba(255, 255, 255, .11); --lg-fill-press: rgba(255, 255, 255, .03);
        --lg-shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 28px rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .35); } }

      .button, .native .button, .row-actions { transition: transform .22s cubic-bezier(.34, 1.56, .64, 1), background .18s ease, box-shadow .18s ease; }
      .button:hover:not(:disabled), .native .button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--lg-shadow), 0 12px 30px rgba(0, 0, 0, .12), var(--lg-inner); }
      .button:active:not(:disabled), .native .button:active:not(:disabled) { transform: scale(.93) translateY(1px); transition-duration: .06s; box-shadow: inset 0 2px 6px rgba(0, 0, 0, .28), 0 1px 1px rgba(0, 0, 0, .1); }

      /* Main action: cool teal-to-indigo glass */
      .button.primary, .native .button.primary {
        background: var(--lg-sheen) padding-box, linear-gradient(135deg, color-mix(in srgb, var(--cool-a) 74%, transparent), color-mix(in srgb, var(--cool-b) 78%, transparent)) padding-box, var(--lg-rim) border-box;
        box-shadow: 0 6px 20px color-mix(in srgb, var(--cool-b) 34%, transparent), 0 2px 6px color-mix(in srgb, var(--cool-a) 25%, transparent), var(--lg-inner);
        text-shadow: 0 1px 1px rgba(10, 20, 80, .3); }
      .button.primary:hover:not(:disabled), .native .button.primary:hover:not(:disabled) {
        background: var(--lg-sheen) padding-box, linear-gradient(135deg, color-mix(in srgb, var(--cool-a) 88%, transparent), color-mix(in srgb, var(--cool-b) 90%, transparent)) padding-box, var(--lg-rim) border-box;
        box-shadow: 0 10px 28px color-mix(in srgb, var(--cool-b) 42%, transparent), 0 2px 8px color-mix(in srgb, var(--cool-a) 30%, transparent), var(--lg-inner); }
      .button.primary:active:not(:disabled), .native .button.primary:active:not(:disabled) {
        background: linear-gradient(135deg, color-mix(in srgb, var(--cool-a) 70%, transparent), color-mix(in srgb, var(--cool-b) 74%, transparent)) padding-box, var(--lg-rim) border-box;
        box-shadow: inset 0 2px 6px rgba(10, 20, 80, .4); }
      .row-actions .button.primary { background: linear-gradient(135deg, color-mix(in srgb, var(--cool-a) 80%, transparent), color-mix(in srgb, var(--cool-b) 82%, transparent)); color: #fff; }
      .row-actions .button.primary:hover:not(:disabled) { background: linear-gradient(135deg, var(--cool-a), var(--cool-b)); }
      .row-actions .button:active:not(:disabled) { transform: scale(.92); transition-duration: .06s; }
      .icon-btn[data-action="start"] { color: var(--cool-b); }
      .icon-btn:active { transform: scale(.86); transition: transform .06s ease; }
      .ring.none { --ring-a: var(--c-none-a); }

      /* Pins */
      .pin-glyph { width: 11px; height: 11px; margin-left: 6px; vertical-align: -1px; color: var(--accent); flex: none; }
      .icon-btn[data-pinned="1"] { color: var(--accent); }
      .icon-btn[data-pinned="1"] svg path:first-child { fill: currentColor; fill-opacity: .35; }
      .side-group { padding: 10px 12px 4px; font: 600 11px var(--sans); letter-spacing: .02em; color: var(--tertiary); text-transform: uppercase; }
      .rail .side-group { display: none; }
      .project-item { display: flex; align-items: center; }
      .pinned-list { border-radius: 10px; }
      .pinned-list .resource-list { border-top: 0; padding-top: 6px; }

      /* Start/stop progress */
      .job-progress { display: grid; gap: 8px; margin: 0 0 16px; padding: 12px 14px; border: 1px solid transparent; border-radius: 10px;
        background: var(--lg-sheen) padding-box, linear-gradient(var(--lg-fill), var(--lg-fill)) padding-box, var(--lg-rim) border-box;
        backdrop-filter: var(--lg-blur); -webkit-backdrop-filter: var(--lg-blur); box-shadow: var(--lg-shadow); }
      .job-progress.compact { grid-column: 1 / -1; margin: 4px 0 0; padding: 8px 10px; box-shadow: none; }
      .job-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .job-head strong { font: 600 14px var(--sans); color: var(--label); font-variant-numeric: tabular-nums; }
      .job-head span { font-size: 12.5px; color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
      .job-track { position: relative; height: 6px; border-radius: 3px; overflow: hidden; background: var(--c-track); }
      .job-track i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: linear-gradient(90deg, var(--cool-a), var(--cool-b)); transition: width .6s cubic-bezier(.2, .8, .3, 1); }
      .job-track i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .45), transparent); animation: job-shine 1.6s linear infinite; }
      .job-track.indeterminate i { animation: job-slide 1.3s ease-in-out infinite; }
      @keyframes job-shine { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
      @keyframes job-slide { 0% { left: -30%; } 100% { left: 100%; } }
      @media (prefers-reduced-motion: reduce) { .job-track i::after, .job-track.indeterminate i { animation: none; } }
      .project-row { grid-template-rows: auto; }

      /* Keyboard focus ring for buttons whose own rules above reset box-shadow (the Start/Stop/Restart capsule, primary and quiet buttons). */
      .row-actions .button:focus-visible, .button.primary:focus-visible, .button.quiet:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* ===== Agents: thread list on the left, the open thread or a new one on the right ===== */
      .agent-providers { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
      .provider-chip { display: inline-flex; align-items: center; gap: 7px; min-height: 30px; padding: 0 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--label); font-size: 13px; }
      .provider-chip small { color: var(--secondary); font-size: 12px; }
      .provider-chip.missing { color: var(--secondary); border-style: dashed; }
      .provider-chip a { color: var(--accent); text-decoration: none; font-size: 12px; }
      .agents-layout { display: grid; grid-template-columns: minmax(200px, 250px) minmax(0, 1fr); gap: 18px; align-items: start; }
      .thread-list { display: grid; gap: 2px; max-height: calc(100vh - 230px); overflow: auto; }
      .thread-item { display: flex; align-items: flex-start; gap: 9px; width: 100%; padding: 9px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--secondary); text-align: left; }
      .thread-item:hover { background: var(--surface-alt); color: var(--label); }
      .thread-item.active { background: var(--surface); color: var(--label); box-shadow: 0 0 0 1px var(--line); }
      .thread-item .state-dot { margin-top: 6px; }
      .thread-item-copy { display: grid; gap: 2px; min-width: 0; }
      .thread-item-title { font-size: 14px; font-weight: 500; color: var(--label); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .thread-item-meta { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .thread-empty { padding: 12px 10px; color: var(--secondary); font-size: 13px; }
      .thread-pane { min-width: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
      .thread-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
      .thread-head h2 { margin: 0; font: 600 16px/1.35 var(--sans); overflow-wrap: anywhere; }
      .thread-meta { margin-top: 4px; color: var(--secondary); font-size: 13px; }
      .thread-meta .link-btn { height: auto; padding: 0; font-size: 13px; }
      .thread-actions { display: flex; gap: 6px; flex: none; }
      .transcript { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 16px; max-height: calc(100vh - 330px); min-height: 160px; overflow: auto; }
      .transcript > * { min-width: 0; }
      .msg { font: 400 14px/1.55 var(--sans); color: var(--label); overflow-wrap: anywhere; }
      .msg.user { justify-self: end; max-width: 85%; display: grid; justify-items: end; gap: 4px; }
      .msg.user .bubble { padding: 9px 12px; border-radius: 12px; background: var(--accent-wash); white-space: pre-wrap; }
      .msg.agent pre, .agent-tool pre, .agent-thinking pre, .agent-plan pre { margin: 6px 0 0; padding: 9px 11px; border-radius: 8px; background: var(--surface-alt); font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 280px; overflow: auto; }
      .msg.agent code { font: 12.5px var(--mono); padding: 1px 4px; border-radius: 4px; background: var(--surface-alt); }
      .msg.agent pre code { padding: 0; background: none; }
      .stack-chip { font-size: 11px; color: var(--secondary); }
      .agent-tool, .agent-thinking { border: 1px solid var(--line-soft); border-radius: 8px; background: var(--surface-alt); font-size: 13px; }
      .agent-tool summary, .agent-tool-line, .agent-thinking summary { display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: default; list-style: none; }
      .agent-tool summary::-webkit-details-marker, .agent-thinking summary::-webkit-details-marker { display: none; }
      .agent-tool summary, .agent-thinking summary { cursor: pointer; }
      .agent-tool pre, .agent-thinking pre { margin: 0 10px 10px; background: var(--surface); }
      .agent-tool-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12px; }
      .agent-tool-status { flex: none; color: var(--secondary); font-size: 12px; }
      .agent-tool.refused .agent-tool-status, .agent-tool.failed .agent-tool-status { color: var(--red); }
      .agent-thinking summary { color: var(--secondary); }
      .agent-status { color: var(--secondary); font-size: 12px; }
      .turn-foot { display: flex; align-items: center; gap: 8px; color: var(--secondary); font-size: 12px; }
      .turn-error { padding: 9px 11px; border: 1px solid color-mix(in srgb, var(--red) 35%, var(--line)); border-radius: 8px; background: var(--red-wash); color: var(--red); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .working-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); animation: agent-pulse 1.2s ease-in-out infinite; }
      @keyframes agent-pulse { 50% { opacity: .3; } }
      @media (prefers-reduced-motion: reduce) { .working-dot { animation: none; } }
      .composer { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; padding: 12px 16px 16px; border-top: 1px solid var(--line); }
      .composer textarea, .agent-form textarea { width: 100%; box-sizing: border-box; resize: vertical; min-height: 64px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--label); font: 400 14px/1.5 var(--sans); }
      .composer textarea:focus, .agent-form textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
      .agent-form { display: grid; gap: 14px; padding: 16px; }
      .agent-form h2 { margin: 0; font: 600 16px var(--sans); }
      .agent-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
      .mode-switch { display: inline-flex; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-alt); }
      .mode-switch label { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 6px; color: var(--secondary); font: 500 13px var(--sans); cursor: pointer; }
      .mode-switch input { position: absolute; opacity: 0; pointer-events: none; }
      .mode-switch label:has(input:checked) { background: var(--surface); color: var(--label); box-shadow: 0 0 0 1px var(--line); }
      .mode-switch label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 1px; }
      .mode-note { margin: -4px 0 0; color: var(--secondary); font-size: 13px; }
      .agent-form-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
      .agent-form-foot .check { display: inline-flex; align-items: center; gap: 7px; color: var(--secondary); font-size: 13px; }
      .agent-form-foot .spacer { flex: 1; }
      .shortcut-note { color: var(--tertiary); font-size: 12px; }
      @media (max-width: 840px) {
        .agents-layout { grid-template-columns: 1fr; }
        .thread-list { max-height: 220px; }
        .transcript { max-height: none; }
      }

      /* ===== Apps: the other Flisk tools, pointed at one project ===== */
      .apps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
      .app-card { display: grid; align-content: start; gap: 8px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
      .app-card h3 { margin: 0; font: 600 15px var(--sans); }
      .app-card .app-host { color: var(--tertiary); font: 12px var(--mono); }
      .app-card p { margin: 0; color: var(--secondary); font-size: 13px; line-height: 1.5; }
      .app-card .app-note { color: var(--tertiary); font-size: 12px; }
      .app-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
      .app-actions a.button { text-decoration: none; }
      .apps-project { display: flex; align-items: center; gap: 10px; margin: 0 0 18px; }
      .apps-project .field { grid-auto-flow: column; align-items: center; }
    </style>
  </head>
  <body>

le="Open project"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M2.5 6.2c0-.9.7-1.6 1.6-1.6h3.3l1.6 1.8h5c.9 0 1.5.7 1.5 1.6v6c0 .9-.7 1.6-1.6 1.6H4.1c-.9 0-1.6-.7-1.6-1.6V6.2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="nav-label">Open project</span></button></nav>
        <button id="ws-toggle" class="section-title section-toggle" type="button" aria-expanded="true"><svg class="chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m6 3 5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Projects <span id="side-count" class="count">—</span></button>
        <div id="project-list" class="project-list"><div class="skel-side" aria-label="Finding projects"><i></i><i></i><i></i><i></i></div></div>
        <div class="sidebar-foot">Local projects · refreshes every 7 seconds</div>
      </aside>
      <section class="main">
        <header class="toolbar"><div id="breadcrumb" class="crumb"><strong>Overview</strong></div><div class="toolbar-actions"><button class="button quiet" id="refresh" type="button" aria-label="Refresh projects"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16.5 9a6.6 6.6 0 0 0-11.6-3L3.5 8M3.5 8V4.3M3.5 8h3.7M3.5 11a6.6 6.6 0 0 0 11.6 3l1.4-2M16.5 12v3.7m0-3.7h-3.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Refresh</button></div></header>
        <main id="content" class="content"><div class="content-inner" aria-busy="true" aria-label="Loading local projects"><div class="skel-title"></div><div class="skel-sub"></div><div class="skel-row"></div><div class="skel-row"></div><div class="skel-row"></div></div></main>
